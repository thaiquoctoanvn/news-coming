name: Run worker

# Runs the worker from the `prod` tag, i.e. code whose DB migrations are already deployed
# (DESIGN.md §13). Phase 2: manual trigger only; scheduling arrives in Phase 4.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic id, or "all" for every enabled topic
        default: all
        required: true
      edition:
        description: Edition id (optional, e.g. morning or pre_us)
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: run-${{ inputs.topic }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @news-coming/worker
      - name: Collect news
        working-directory: apps/worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TOPIC: ${{ inputs.topic }}
          EDITION: ${{ inputs.edition }}
        run: node src/index.ts collect --topic "$TOPIC" --trigger manual ${EDITION:+--edition "$EDITION"}
